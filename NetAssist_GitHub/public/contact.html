<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#112b63">
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <title>NetAssist Contact Page</title>
  </head>
<body>
<header id="nav"></header>
<main>

<div class="wrap page" style="max-width:760px">
  <div class="page-head">
    <div class="eyebrow">Contact us</div>
    <h1>Questions or feedback?</h1>
    <p>Found a bug or have an idea for a new check? Send a message and the team will see it in the admin panel.</p>
  </div>

  <div class="card">
    <div class="alert ok" id="done" role="status" hidden>Thanks! Your message was sent.</div>
    <div class="alert bad" id="err" role="alert" hidden></div>
    <form id="f" novalidate>
      <div class="grid g2" style="gap:0 16px">
        <div class="field"><label for="name">Name</label>
          <input id="name" name="name" required>
          <div class="err"></div></div>
        <div class="field"><label for="email">Email</label>
          <input id="email" name="email" type="email" required>
          <div class="err"></div></div>
      </div>

      <div class="field">
        <label for="subject">Subject</label>
        <input id="subject" name="subject" required>
        <div class="err"></div></div>
      
        <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>
        <div class="err"></div></div>

      <button class="btn btn-primary" id="go">Send message</button>

    </form>
  </div>
</div>

</main>
<footer id="footer"></footer>
<script src="/js/app.js"></script>
<script src="/js/formkit.js"></script>
<script src="/js/contact.js"></script>

</body>
</html>
