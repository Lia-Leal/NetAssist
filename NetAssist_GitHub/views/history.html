<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#112b63"><script src="/js/theme.js"></script><link rel="stylesheet" href="/css/style.css"><link rel="icon" type="image/png" href="/img/favicon.png"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png"><title>Diagnostic History | NetAssist</title></head>
<body>
<header id="nav"></header>
<main>

      <select id="days" aria-label="Date range"><option value="0">All dates</option><option value="1">Today</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option></select></div>
    <div id="list"><div class="skeleton" style="height:200px"></div></div><div class="pager" id="pager"></div>
  </div>
</div>
</main>
<footer id="footer"></footer>
<script src="/js/app.js"></script>
<script src="/js/history.js"></script>
